[package]
name = "thread-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[lib]
name = "thread_search"
path = "src/lib.rs"

[[bin]]
name = "threads"
path = "src/main.rs"

[dependencies]
memchr = "2.8.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
